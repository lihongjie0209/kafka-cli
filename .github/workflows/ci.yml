name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.15.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  bundled-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake libcurl4-openssl-dev pkg-config
      - run: cargo build --release --locked --features bundled

  musl-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig from the official release index
        shell: bash
        run: |
          set -euo pipefail
          index_file="$RUNNER_TEMP/zig-index.json"
          archive_file="$RUNNER_TEMP/zig.tar.xz"
          install_dir="$RUNNER_TEMP/zig"
          curl --fail --location --retry 3 --silent --show-error \
            https://ziglang.org/download/index.json \
            --output "$index_file"
          archive_url="$(jq --raw-output --arg version "$ZIG_VERSION" \
            '.[$version]["x86_64-linux"].tarball' "$index_file")"
          archive_sha="$(jq --raw-output --arg version "$ZIG_VERSION" \
            '.[$version]["x86_64-linux"].shasum' "$index_file")"
          test "$archive_url" != "null"
          test "$archive_sha" != "null"
          curl --fail --location --retry 3 --silent --show-error \
            "$archive_url" --output "$archive_file"
          echo "$archive_sha  $archive_file" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --xz --file "$archive_file" \
            --directory "$install_dir" --strip-components=1
          echo "$install_dir" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@cargo-zigbuild
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: ${{ matrix.target }}
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }} --features bundled
      - name: Verify static musl binary
        run: file target/${{ matrix.target }}/release/kafka | tee binary-type.txt
      - name: Install ARM64 user-mode emulator
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Smoke test musl binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/kafka"
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            runner=(qemu-aarch64-static "$binary")
          else
            runner=("$binary")
          fi
          "${runner[@]}" --version | grep --fixed-strings "kafka 0.1.1"
          "${runner[@]}" --help >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: kafka-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/kafka
            binary-type.txt
          if-no-files-found: error

  kafka-4-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake libcurl4-openssl-dev pkg-config
      - run: cargo test --locked --features bundled --test kafka_4_integration -- --ignored --nocapture
      - name: Full command-matrix integration (testcontainers)
        run: cargo test --locked --features bundled --test kafka_full_integration -- --ignored --nocapture --test-threads=1

  kafka-3-integration:
    runs-on: ubuntu-latest
    env:
      KAFKA_36_HOME: ${{ github.workspace }}/.kafka/kafka_2.13-3.6.2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2.9.1
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake libcurl4-openssl-dev pkg-config
      - name: Download Apache Kafka 3.6.2
        run: |
          mkdir -p .kafka
          curl --fail --location --retry 3 \
            https://archive.apache.org/dist/kafka/3.6.2/kafka_2.13-3.6.2.tgz \
            | tar -xz -C .kafka
      - run: cargo test --locked --features bundled --test kafka_3_integration -- --ignored --nocapture
