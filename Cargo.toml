[package]
name = "kafka-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native Kafka command-line administration and data tool"
license = "Apache-2.0"

[features]
default = []
bundled = [
    "rdkafka/cmake-build",
    "rdkafka/curl-static",
    "rdkafka/ssl-vendored",
]

[lib]
name = "kafka_cli"
path = "src/lib.rs"

[[bin]]
name = "kafka"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
comfy-table = { version = "7.2", default-features = false }
csv = "1.3"
futures = "0.3"
java-properties = "2.0"
krafka = { version = "0.14", features = ["native-tls-roots"] }
rdkafka = { version = "0.39", features = ["tokio"] }
rdkafka-sys = "4.10.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["kafka"] }

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 5 }
nursery = { level = "warn", priority = 4 }
module_name_repetitions = "allow"
missing_errors_doc = { level = "allow", priority = 20 }
missing_panics_doc = { level = "allow", priority = 20 }
